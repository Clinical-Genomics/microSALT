name: Build and push production containers on release

on:
  release:
    types:
      - created

jobs:
  build-containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool:
          - blast
          - bwa
          - picard
          - quast
          - samtools
          - skesa
          - trimmomatic
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.tool }} production image
        uses: docker/build-push-action@v6
        with:
          context: ./containers
          file: ./containers/Dockerfile.${{ matrix.tool }}
          push: true
          platforms: linux/amd64
          tags: |
            clinicalgenomics/microsalt-${{ matrix.tool }}:${{ github.event.release.tag_name }}
            clinicalgenomics/microsalt-${{ matrix.tool }}:latest
          provenance: false
