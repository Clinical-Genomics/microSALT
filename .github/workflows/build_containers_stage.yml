name: Build and push staging containers

on:
  workflow_dispatch:

jobs:
  build-containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool:
          - blast
          - bwa
          - picard
          - quast
          - samtools
          - skesa
          - trimmomatic
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Extract branch name
        id: get_branch_name
        shell: bash
        run: echo "branch=$(tr '/' '-' <<<${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.tool }} stage image
        uses: docker/build-push-action@v6
        with:
          context: ./containers
          file: ./containers/Dockerfile.${{ matrix.tool }}
          push: true
          platforms: linux/amd64
          tags: |
            clinicalgenomics/microsalt-${{ matrix.tool }}-stage:${{ steps.get_branch_name.outputs.branch }}
            clinicalgenomics/microsalt-${{ matrix.tool }}-stage:latest
          provenance: false
