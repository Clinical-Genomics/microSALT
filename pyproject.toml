[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microSALT"
dynamic = ["version"]
description = "Microbial Sequence Analysis and Loci-based Typing"
authors = [
    {name = "Isak Sylvin", email = "isak.sylvin@scilifelab.se"},
]
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.81",
    "bs4==0.0.1",
    "click>=8.0",
    "Jinja2>=3.1",
    "pydantic>=2.0",
    "python-dateutil>=2.8",
    "pymysql>=1.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "requests-oauthlib>=1.3",
    "werkzeug>=3.1.6",
]

[project.scripts]
microsalt = "microSALT.cli:root"

[project.urls]
Homepage = "https://github.com/Clinical-Genomics/microSALT"

[tool.setuptools.dynamic]
version = {attr = "microSALT.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["microSALT*"]

[tool.setuptools.package-data]
"microSALT" = ["unique_references/*", "artwork/*"]
"microSALT.server" = ["templates/*"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "flake8>=6.0",
    "gitlint>=0.19.1",
    "pytest>=7.4",
    "pylint>=3.0",
    "yamllint>=1.32",
]
